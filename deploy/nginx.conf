# P2BOYUAN v0.1 Nginx example
#
# Adjust these values before deployment:
# - server_name
# - TLS certificate paths
# - frontend root path
# - backend Laravel public path
# - PHP-FPM socket or upstream address
#
# Expected build layout:
# - Vue frontend build output copied to: /var/www/p2boyuan/frontend/dist
# - Laravel backend deployed to:       /var/www/p2boyuan/backend

server {
    listen 80;
    server_name demo.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name demo.example.com;

    ssl_certificate /etc/letsencrypt/live/demo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.example.com/privkey.pem;

    client_max_body_size 20m;

    root /var/www/p2boyuan/frontend/dist;
    index index.html;

    # Vue static assets and history mode fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Laravel API handled by PHP-FPM through the backend public directory.
    location ^~ /api/ {
        alias /var/www/p2boyuan/backend/public/;
        try_files $uri /index.php?$query_string;
    }

    # Laravel storage files if public storage is linked.
    location ^~ /storage/ {
        alias /var/www/p2boyuan/backend/public/storage/;
        try_files $uri =404;
    }

    # PHP-FPM example. The socket path varies by server and PHP version.
    location ~ ^/index\.php$ {
        root /var/www/p2boyuan/backend/public;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/p2boyuan/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/p2boyuan/backend/public;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# Alternative API reverse proxy example:
#
# If Laravel runs behind a separate process such as:
#   php artisan serve --host=127.0.0.1 --port=8000
# or a process manager exposes it on 127.0.0.1:8000, replace the /api/
# and PHP-FPM locations above with:
#
# location ^~ /api/ {
#     proxy_pass http://127.0.0.1:8000/api/;
#     proxy_set_header Host $host;
#     proxy_set_header X-Real-IP $remote_addr;
#     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#     proxy_set_header X-Forwarded-Proto $scheme;
# }
