<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>版本迭代 PRD v0.1-v1.0 功能完成情况核对矩阵</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #fff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #d7dce3;
      --line-soft: #e8ebef;
      --blue: #2563eb;
      --green: #15803d;
      --green-bg: #dcfce7;
      --red: #b91c1c;
      --red-bg: #fee2e2;
      --gray: #4b5563;
      --gray-bg: #e5e7eb;
      --yellow: #92400e;
      --yellow-bg: #fef3c7;
      --blank-bg: #f9fafb;
      --shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
      line-height: 1.5;
    }

    header {
      padding: 28px 32px 18px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      max-width: 1180px;
    }

    main { padding: 18px 24px 34px; }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      gap: 14px;
      grid-template-columns: 1.3fr 0.8fr auto auto auto;
      align-items: end;
      padding: 16px;
      margin-bottom: 16px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }

    input, select, textarea, button { font: inherit; }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 6px;
      padding: 9px 10px;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    button {
      height: 40px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 6px;
      padding: 0 13px;
      cursor: pointer;
      white-space: nowrap;
    }

    button.primary {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }

    button:hover { border-color: var(--blue); }

    .stats {
      display: grid;
      grid-template-columns: repeat(5, minmax(120px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .stat {
      padding: 12px 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .stat strong {
      display: block;
      font-size: 24px;
      line-height: 1.1;
    }

    .stat span {
      color: var(--muted);
      font-size: 12px;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 13px;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
    }

    .matrix-wrap {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: auto;
      box-shadow: var(--shadow);
    }

    table {
      width: 100%;
      min-width: 1180px;
      border-collapse: separate;
      border-spacing: 0;
    }

    th, td {
      border-bottom: 1px solid var(--line-soft);
      vertical-align: top;
    }

    th {
      position: sticky;
      top: 91px;
      z-index: 10;
      padding: 12px 10px;
      background: #f3f4f6;
      color: #374151;
      font-size: 13px;
      text-align: left;
      border-bottom: 1px solid var(--line);
    }

    td {
      padding: 10px;
      background: #fff;
    }

    tr:hover td { background: #fbfdff; }

    .module { width: 300px; }

    .module-name {
      font-weight: 700;
      margin-bottom: 4px;
    }

    .module-group {
      display: inline-block;
      margin-bottom: 6px;
      padding: 2px 7px;
      border-radius: 999px;
      background: #eef2ff;
      color: #3730a3;
      font-size: 12px;
    }

    .module-desc {
      color: var(--muted);
      font-size: 12px;
    }

    .status-cell { width: 144px; }

    .status-select { font-weight: 700; }
    .status-complete { background: var(--green-bg); color: var(--green); border-color: #86efac; }
    .status-incomplete { background: var(--red-bg); color: var(--red); border-color: #fecaca; }
    .status-not-started { background: var(--gray-bg); color: var(--gray); border-color: #d1d5db; }
    .status-unknown { background: var(--yellow-bg); color: var(--yellow); border-color: #fde68a; }
    .status-blank { background: var(--blank-bg); color: var(--muted); }

    .evidence { min-width: 320px; }

    textarea {
      min-height: 82px;
      resize: vertical;
      font-size: 13px;
    }

    .meta {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .footnote {
      margin-top: 14px;
      color: var(--muted);
      font-size: 12px;
    }

    code {
      font-family: Consolas, "Courier New", monospace;
      background: #eef2f7;
      border-radius: 4px;
      padding: 1px 4px;
    }

    @media (max-width: 900px) {
      header { padding: 22px 18px 16px; }
      main { padding: 14px; }
      .toolbar { position: static; grid-template-columns: 1fr; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      th { top: 0; }
    }
  </style>
</head>
<body>
  <header>
    <h1>版本迭代 PRD v0.1-v1.0 功能完成情况核对矩阵</h1>
    <p class="subtitle">
      来源：<code>PRD_版本迭代文档</code> 中 v0.1 到 v1.0 的版本迭代 PRD。
    </p>
  </header>

  <main>
    <section class="toolbar" aria-label="工具栏">
      <div>
        <label for="searchInput">搜索功能模块</label>
        <input id="searchInput" type="search" placeholder="例如：放款、账单、设备、通知、权限" />
      </div>
      <div>
        <label for="statusFilter">按状态筛选</label>
        <select id="statusFilter">
          <option value="">全部状态</option>
          <option value="完成">完成</option>
          <option value="未完成">未完成</option>
          <option value="未开始">未开始</option>
          <option value="未知">未知</option>
          <option value="__blank__">空白</option>
        </select>
      </div>
      <button class="primary" id="exportJsonBtn" type="button">导出 JSON</button>
      <button id="exportCsvBtn" type="button">导出 CSV</button>
      <button id="resetBtn" type="button">恢复初始判断</button>
    </section>

    <section class="stats" aria-label="统计">
      <div class="stat"><strong id="totalCount">0</strong><span>当前显示模块</span></div>
      <div class="stat"><strong id="completeCount">0</strong><span>完成</span></div>
      <div class="stat"><strong id="incompleteCount">0</strong><span>未完成</span></div>
      <div class="stat"><strong id="notStartedCount">0</strong><span>未开始</span></div>
      <div class="stat"><strong id="unknownCount">0</strong><span>未知 / 空白</span></div>
    </section>

    <p class="legend">
      <span>完成：有可用实现并能支撑业务闭环</span>
      <span>未完成：半成品、错位实现或缺核心逻辑</span>
      <span>未开始：未看到实现</span>
      <span>未知：证据不足，需要会上确认</span>
    </p>

    <section class="matrix-wrap">
      <table>
        <thead>
          <tr>
            <th class="module">PRD v0.1-v1.0 功能模块</th>
            <th class="status-cell">前端完成情况</th>
            <th class="status-cell">后端完成情况</th>
            <th class="status-cell">联调情况</th>
            <th class="status-cell">测试情况</th>
            <th class="evidence">会议证据 / 备注</th>
          </tr>
        </thead>
        <tbody id="matrixBody"></tbody>
      </table>
    </section>

    <p class="footnote">
      说明：本矩阵按 v0.1 到 v1.0 的版本路线累计展开功能点。修改会自动保存在当前浏览器 localStorage。
    </p>
  </main>

      { id: "v10-backup-security", group: "v1.0 正式生产基础版", module: "基础安全、备份、监控和数据管理", desc: "安全测试、备份演练、生产数据权限和监控。", frontend: "", backend: "未开始", integration: "", testing: "未开始", note: "未看到备份任务、监控、恢复演练或生产权限验收材料。" },
      { id: "v10-basic-statistics", group: "v1.0 正式生产基础版", module: "基础统计", desc: "申请量、通过率、放款金额、逾期数量。", frontend: "", backend: "未开始", integration: "", testing: "未开始", note: "未看到统计聚合接口或报表测试。" }
    ];

    let rows = loadRows();

    function loadRows() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return structuredClone(initialRows);
      try {
        const parsed = JSON.parse(raw);
        const byId = new Map(parsed.map((row) => [row.id, row]));
        return initialRows.map((row) => ({ ...row, ...(byId.get(row.id) || {}) }));
      } catch (error) {
        console.warn("无法读取本地保存数据，已恢复初始判断。", error);
        return structuredClone(initialRows);
      }
    }

    function saveRows() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(rows, null, 2));
    }

    function statusClass(value) {
      if (value === "完成") return "status-complete";
      if (value === "未完成") return "status-incomplete";
      if (value === "未开始") return "status-not-started";
      if (value === "未知") return "status-unknown";
      return "status-blank";
    }

    function render() {
      const query = document.getElementById("searchInput").value.trim().toLowerCase();
      const filter = document.getElementById("statusFilter").value;
      const body = document.getElementById("matrixBody");
      body.innerHTML = "";

      const visibleRows = rows.filter((row) => {
        const haystack = `${row.group} ${row.module} ${row.desc} ${row.note}`.toLowerCase();
        const matchesQuery = !query || haystack.includes(query);
        const values = columns.map((column) => row[column] || "");
        const matchesFilter = !filter ||
          (filter === "__blank__" ? values.some((value) => value === "") : values.some((value) => value === filter));
        return matchesQuery && matchesFilter;
      });

      for (const row of visibleRows) {
        const tr = document.createElement("tr");
        tr.dataset.id = row.id;

        const moduleTd = document.createElement("td");
        moduleTd.className = "module";
        moduleTd.innerHTML = `
          <span class="module-group">${escapeHtml(row.group)}</span>
          <div class="module-name">${escapeHtml(row.module)}</div>
          <div class="module-desc">${escapeHtml(row.desc)}</div>
        `;
        tr.appendChild(moduleTd);

        for (const column of columns) {
          const td = document.createElement("td");
          td.className = "status-cell";
          const select = document.createElement("select");
          select.className = `status-select ${statusClass(row[column])}`;
          select.dataset.id = row.id;
          select.dataset.column = column;
          for (const status of statuses) {
            const option = document.createElement("option");
            option.value = status;
            option.textContent = status || "空白";
            if ((row[column] || "") === status) option.selected = true;
            select.appendChild(option);
          }
          select.addEventListener("change", handleStatusChange);
          td.appendChild(select);
          tr.appendChild(td);
        }

        const noteTd = document.createElement("td");
        noteTd.className = "evidence";
        const textarea = document.createElement("textarea");
        textarea.dataset.id = row.id;
        textarea.value = row.note || "";
        textarea.placeholder = "会议现场记录：负责人、接口地址、截图、阻塞点、待验证事项...";
        textarea.addEventListener("input", handleNoteChange);
        noteTd.appendChild(textarea);
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = `模块 ID：${row.id}`;
        noteTd.appendChild(meta);
        tr.appendChild(noteTd);

        body.appendChild(tr);
      }

      updateStats(visibleRows);
    }

    function handleStatusChange(event) {
      const { id, column } = event.target.dataset;
      const row = rows.find((item) => item.id === id);
      row[column] = event.target.value;
      event.target.className = `status-select ${statusClass(event.target.value)}`;
      saveRows();
      render();
    }

    function handleNoteChange(event) {
      const row = rows.find((item) => item.id === event.target.dataset.id);
      row.note = event.target.value;
      saveRows();
    }

    function updateStats(visibleRows) {
      const values = visibleRows.flatMap((row) => columns.map((column) => row[column] || ""));
      document.getElementById("totalCount").textContent = visibleRows.length;
      document.getElementById("completeCount").textContent = values.filter((value) => value === "完成").length;
      document.getElementById("incompleteCount").textContent = values.filter((value) => value === "未完成").length;
      document.getElementById("notStartedCount").textContent = values.filter((value) => value === "未开始").length;
      document.getElementById("unknownCount").textContent = values.filter((value) => value === "未知" || value === "").length;
    }

    function exportJson() {
      downloadFile("version-prd-v10-coverage-matrix.json", JSON.stringify(rows, null, 2), "application/json;charset=utf-8");
    }

    function exportCsv() {
      const header = ["功能分组", "功能模块", "说明", "前端完成情况", "后端完成情况", "联调情况", "测试情况", "会议证据/备注"];
      const lines = [header, ...rows.map((row) => [
        row.group,
        row.module,
        row.desc,
        row.frontend || "",
        row.backend || "",
        row.integration || "",
        row.testing || "",
        row.note || ""
      ])].map((line) => line.map(csvCell).join(","));
      downloadFile("version-prd-v10-coverage-matrix.csv", lines.join("\n"), "text/csv;charset=utf-8");
    }

    function downloadFile(filename, content, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function csvCell(value) {
      return `"${String(value).replaceAll('"', '""')}"`;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    document.getElementById("searchInput").addEventListener("input", render);
    document.getElementById("statusFilter").addEventListener("change", render);
    document.getElementById("exportJsonBtn").addEventListener("click", exportJson);
    document.getElementById("exportCsvBtn").addEventListener("click", exportCsv);
    document.getElementById("resetBtn").addEventListener("click", () => {
      if (!confirm("确认恢复到 v1.0 正式生产基础版 PRD 的初始代码 review 判断？这会覆盖你在本浏览器里的修改。")) return;
      rows = structuredClone(initialRows);
      saveRows();
      render();
    });

    render();
  </script>
