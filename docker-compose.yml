services:
  nginx:
    image: nginx:1.27-alpine
    container_name: p2boyuan_v01_nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/html/public:ro
      - backend_storage:/var/www/html/storage:ro

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: p2boyuan_v01_frontend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: p2boyuan_v01_backend
    restart: unless-stopped
    env_file:
      - path: ./backend/.env.docker
        required: false
    environment:
      APP_NAME: ${APP_NAME:-P2BOYUAN}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${BACKEND_APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-p2boyuan_v01}
      DB_USERNAME: ${MYSQL_USER:-p2boyuan}
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in root .env}
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: public
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - backend_storage:/var/www/html/storage

  mysql:
    image: mysql:8.0
    container_name: p2boyuan_v01_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-p2boyuan_v01}
      MYSQL_USER: ${MYSQL_USER:-p2boyuan}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in root .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in root .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-p${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in root .env}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  backend_storage:
